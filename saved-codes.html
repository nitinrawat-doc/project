<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Codes - CodeLink Syntax Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <button class="menu-btn" onclick="window.location.href='index.html'">← Back</button>
            <div class="logo">
                <div class="logo-icon">CL</div>
                Saved Codes
            </div>
        </div>
        <div class="navbar-right">
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </nav>

    <main class="container">
        <div class="saved-codes-container" id="savedCodesDisplay">
            <h2>📚 Your Saved Codes</h2>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 CodeLink Syntax Pro - Say goodbye to errors ✨</p>
    </footer>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        });

        function displaySavedCodes() {
            const savedCodesDisplay = document.getElementById('savedCodesDisplay');
            const savedCodes = JSON.parse(localStorage.getItem('codes')) || [];

            if (savedCodes.length === 0) {
                savedCodesDisplay.innerHTML = '<h2>📚 Your Saved Codes</h2><p style="text-align: center; margin-top: 30px; opacity: 0.5;">No saved codes yet. Start coding!</p>';
                return;
            }

            let html = '<h2>📚 Your Saved Codes</h2>';
            savedCodes.forEach((item, index) => {
                html += `
                    <div class="saved-code" data-index="${index}">
                        <strong>${item.name || item.language.toUpperCase() + ' Code #' + (index + 1)}</strong>
                        <pre>${item.code}</pre>
                        <button class="delete-btn" onclick="deleteSavedCode(${index})">🗑️ Delete</button>
                    </div>
                `;
            });

            savedCodesDisplay.innerHTML = html;

            document.querySelectorAll('.saved-code').forEach(codeDiv => {
                codeDiv.addEventListener('click', function(e) {
                    if (e.target.classList.contains('delete-btn')) return;
                    
                    const index = this.dataset.index;
                    const savedCodes = JSON.parse(localStorage.getItem('codes')) || [];
                    const selectedCode = savedCodes[index];

                    localStorage.setItem('codeToLoad', selectedCode.code);
                    localStorage.setItem('languageToLoad', selectedCode.language);
                    window.location.href = 'index.html';
                });
            });
        }

        function deleteSavedCode(index) {
            if (confirm('Are you sure you want to delete this code?')) {
                let savedCodes = JSON.parse(localStorage.getItem('codes')) || [];
                savedCodes.splice(index, 1);
                localStorage.setItem('codes', JSON.stringify(savedCodes));
                displaySavedCodes();
            }
        }

        displaySavedCodes();
    </script>
</body>
</html>
